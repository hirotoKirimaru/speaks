[project]
name = "speaks"
version = "0.1.0"
description = "ローカル音声文字起こし + 議事録要約ツール"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "pyannote-audio>=4.0.4",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "transformers>=4.45.0",
    "typer>=0.24.0",
]

[project.optional-dependencies]
sortformer = ["nemo_toolkit[asr]>=2.0.0"]

[project.scripts]
speaks = "speaks.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speaks"]

[tool.hatch.build.targets.wheel.force-include]
"speaks/data/hallucination_phrases.ja.txt" = "speaks/data/hallucination_phrases.ja.txt"
